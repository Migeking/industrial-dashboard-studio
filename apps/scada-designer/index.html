<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SCADA 场景设计器 · 工业大屏工作台</title>
<link rel="stylesheet" href="../../packages/design-system/tokens.css">
<link rel="stylesheet" href="../../packages/components/industrial-components.css">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:var(--ids-bg);color:var(--ids-text);font-family:var(--ids-font)}
.shell{min-height:100svh;display:grid;grid-template-columns:260px minmax(0,1fr) 300px;grid-template-rows:64px 1fr;background:radial-gradient(900px 560px at 85% 0%,rgba(97,201,255,.08),transparent 65%),var(--ids-bg)}
header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--ids-line);background:rgba(7,16,22,.94)}.brand small{display:block;color:var(--ids-normal);letter-spacing:.18em;font-size:10px}.brand b{display:block;margin-top:3px;font-size:17px;letter-spacing:.1em}.header-actions{display:flex;gap:8px}.header-actions .ids-button{min-height:36px}
aside{padding:14px;border-right:1px solid var(--ids-line);overflow:auto}.right{border-right:0;border-left:1px solid var(--ids-line)}.section-label{margin:6px 2px 10px;color:var(--ids-muted);font-size:11px;letter-spacing:.16em}.library{display:grid;gap:8px}.block{width:100%;padding:11px;border:1px solid var(--ids-line);border-radius:6px;background:var(--ids-surface);color:var(--ids-text);text-align:left;cursor:pointer}.block:hover,.block.active{border-color:var(--ids-primary);background:rgba(97,201,255,.08)}.block span{display:block;color:var(--ids-muted);font-size:11px;margin-top:4px}
.canvas{min-width:0;padding:18px;overflow:auto}.canvas-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:var(--ids-muted);font-size:12px}.canvas-top b{color:var(--ids-text)}.board{position:relative;min-width:860px;aspect-ratio:16/9;max-height:calc(100svh - 124px);margin:auto;border:1px solid var(--ids-line);background:linear-gradient(145deg,#0b1c26,#071016);overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.35)}.board:before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(97,201,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(97,201,255,.05) 1px,transparent 1px);background-size:34px 34px}.board header{position:relative;height:12%;padding:0 3%;border-bottom:1px solid var(--ids-line);background:rgba(5,14,20,.75)}.board h1{font-size:clamp(20px,2vw,34px);letter-spacing:.1em;margin:0}.board .clock{font-family:var(--ids-number);color:var(--ids-primary)}.board-main{position:relative;height:88%;display:grid;grid-template-columns:22% 1fr 23%;gap:1.2%;padding:1.4%}.mock-panel{border:1px solid var(--ids-line);background:rgba(11,29,37,.83);padding:5%;min-width:0}.flow{display:grid;place-items:center;position:relative}.flow svg{width:88%;max-height:78%}.node{cursor:pointer}.node rect{fill:#102d3a;stroke:#31576a;stroke-width:2}.node.active rect{stroke:var(--ids-primary);filter:drop-shadow(0 0 10px rgba(97,201,255,.5))}.node text{fill:#e8f3f4;font:14px var(--ids-font)}.pipe{fill:none;stroke:var(--ids-normal);stroke-width:5;stroke-dasharray:10 10}.mock-kpi{border-left:3px solid var(--ids-primary);padding:10px 0 10px 10px;margin-bottom:8px}.mock-kpi label{display:block;color:var(--ids-muted);font-size:11px}.mock-kpi b{font:700 26px var(--ids-number);color:var(--ids-text)}.alarm{padding:10px;border-bottom:1px solid var(--ids-line);font-size:11px}.alarm.warn{border-left:3px solid var(--ids-warning)}.alarm.ok{border-left:3px solid var(--ids-normal)}
.field{margin-bottom:14px}.field label{display:block;margin-bottom:6px;color:var(--ids-muted);font-size:11px}.field input,.field select{width:100%;min-height:38px;border:1px solid var(--ids-line);border-radius:5px;background:#09171e;color:var(--ids-text);padding:8px;font:13px var(--ids-font)}.field input[type=color]{padding:3px}.help{font-size:11px;line-height:1.6;color:var(--ids-muted)}.quality{margin-top:16px;padding:12px}.quality b{display:block;font-size:12px;color:var(--ids-normal)}
@media(max-width:1100px){.shell{grid-template-columns:220px minmax(0,1fr)}.right{display:none}}@media(max-width:760px){.shell{display:block}.shell>header{height:58px}.left{border-right:0;border-bottom:1px solid var(--ids-line);display:flex;gap:8px;padding:8px;overflow:auto}.left .section-label{display:none}.library{display:flex}.block{min-width:155px}.canvas{padding:10px}.board{min-width:720px}.header-actions .ids-button:first-child{display:none}}
</style>
</head>
<body>
<div class="shell" id="designer">
  <header><div class="brand"><small>SCADA / HMI FOUNDATION</small><b>工业场景设计器</b></div><div class="header-actions"><button class="ids-button" id="openShowcase">打开互动体验包</button><button class="ids-button" id="exportConfig">导出场景配置</button></div></header>
  <aside class="left"><div class="section-label">场景母版</div><div class="library"><button class="block active" data-template="water">水处理工艺<span>流程、曝气、出水质量</span></button><button class="block" data-template="asset">设备健康<span>状态、频谱、维修窗口</span></button><button class="block" data-template="safety">安全联锁<span>阈值、因果链、SIS</span></button></div><div class="section-label">画布模块</div><div class="library"><button class="block" data-module="kpi">KPI 指标卡<span>数据优先级与状态色</span></button><button class="block" data-module="flow">工艺流程<span>设备与物料路径</span></button><button class="block" data-module="alarm">告警事件<span>确认与处置状态</span></button></div></aside>
  <main class="canvas"><div class="canvas-top"><span>画布：<b>1920 × 1080</b></span><span id="savedAt">未保存</span></div><section class="board"><header><div><small id="previewDomain" class="eyebrow">WATER TREATMENT</small><h1 id="previewTitle">A²/O 脱氮除磷精准调控</h1></div><span id="clock" class="clock">--:--:--</span></header><div class="board-main"><section class="mock-panel"><div class="mock-kpi"><label>进水负荷</label><b id="kpiLoad">79%</b></div><div class="mock-kpi"><label id="kpiLabel">出水合格率</label><b id="kpiHealth">92%</b></div><div class="ids-status">数据质量 GOOD</div></section><section class="mock-panel flow"><svg viewBox="0 0 560 330" aria-label="工艺流程预览"><path class="pipe" d="M74 164H190M270 164H380M460 164H520"/><g class="node active" data-node="进水单元"><rect x="20" y="114" width="110" height="100" rx="7"/><text x="75" y="154" text-anchor="middle">进水单元</text><text x="75" y="181" text-anchor="middle">RUN</text></g><g class="node" data-node="核心设备"><rect x="190" y="94" width="90" height="140" rx="7"/><text x="235" y="151" text-anchor="middle">核心设备</text><text x="235" y="179" text-anchor="middle">AUTO</text></g><g class="node" data-node="末端处置"><rect x="380" y="114" width="80" height="100" rx="7"/><text x="420" y="154" text-anchor="middle">末端处置</text><text x="420" y="181" text-anchor="middle">GOOD</text></g></svg><span class="help">点击设备节点，在右侧编辑其名称与状态</span></section><section class="mock-panel"><div class="alarm warn">告警：冷却水流量接近预警阈值</div><div class="alarm ok">事件：设备自检通过</div><div class="alarm ok">通信：OPC UA 网关在线</div></section></div></section></main>
  <aside class="right"><div class="section-label">场景属性</div><div class="field"><label for="sceneTitle">场景名称</label><input id="sceneTitle" value="A²/O 脱氮除磷精准调控"></div><div class="field"><label for="sceneDomain">行业类型</label><select id="sceneDomain"><option value="water">智慧水务</option><option value="asset">设备运维</option><option value="safety">化工安全</option></select></div><div class="field"><label for="accent">主数据颜色</label><input id="accent" type="color" value="#61c9ff"></div><div class="field"><label for="nodeName">当前设备</label><input id="nodeName" value="进水单元"></div><div class="field"><label for="nodeState">设备状态</label><select id="nodeState"><option value="RUN">运行</option><option value="AUTO">自动</option><option value="STANDBY">待命</option><option value="TRIP">联锁</option></select></div><div class="quality ids-panel"><b id="adapterState">演示数据已启用</b><span class="help">当前编辑器只使用本地模拟数据；接入现场前需选择 REST 或 WebSocket 适配器。</span></div></aside>
</div>
<script src="../../packages/runtime/dashboard-runtime.js"></script>
<script src="../../packages/data-adapters/demo-adapter.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const state = { template: 'water', title: $('sceneTitle').value, accent: $('accent').value, node: '进水单元', nodeState: 'RUN' };
  const labels = { water: ['WATER TREATMENT', '出水合格率'], asset: ['ASSET HEALTH', '设备健康度'], safety: ['SAFETY INTERLOCK', 'SIS 可用率'] };
  const save = () => { localStorage.setItem('industrial-dashboard-designer', JSON.stringify(state)); $('savedAt').textContent = `已保存 ${new Date().toLocaleTimeString('zh-CN', { hour12: false })}`; };
  const render = () => { const meta = labels[state.template]; document.documentElement.style.setProperty('--ids-primary', state.accent); $('previewTitle').textContent = state.title; $('previewDomain').textContent = meta[0]; $('kpiLabel').textContent = meta[1]; document.querySelectorAll('.node').forEach(node => { const selected = node.dataset.node === state.node; node.classList.toggle('active', selected); if (selected) { node.querySelector('text').textContent = state.node; node.querySelectorAll('text')[1].textContent = state.nodeState; } }); save(); };
  try { Object.assign(state, JSON.parse(localStorage.getItem('industrial-dashboard-designer') || '{}')); } catch (_) {}
  $('sceneTitle').value = state.title; $('accent').value = state.accent; $('nodeName').value = state.node; $('nodeState').value = state.nodeState; $('sceneDomain').value = state.template;
  document.querySelectorAll('[data-template]').forEach(button => button.addEventListener('click', () => { state.template = button.dataset.template; $('sceneDomain').value = state.template; document.querySelectorAll('[data-template]').forEach(item => item.classList.toggle('active', item === button)); render(); }));
  [['sceneTitle','title'],['accent','accent'],['nodeName','node'],['nodeState','nodeState'],['sceneDomain','template']].forEach(([id,key]) => $(id).addEventListener('input', event => { state[key] = event.target.value; render(); }));
  document.querySelectorAll('.node').forEach(node => node.addEventListener('click', () => { state.node = node.dataset.node; $('nodeName').value = state.node; render(); }));
  $('exportConfig').addEventListener('click', () => { const file = new Blob([JSON.stringify({ schema: 'industrial-dashboard-scenario/v1', ...state }, null, 2)], { type: 'application/json' }); const link = document.createElement('a'); link.href = URL.createObjectURL(file); link.download = 'scenario-config.json'; link.click(); URL.revokeObjectURL(link.href); });
  $('openShowcase').addEventListener('click', () => window.open('../showcase/index.html', '_blank', 'noopener'));
  DashboardRuntime.createClock($('clock'));
  const demo = createDemoAdapter({ seed: 20260919 }); demo.start(data => { $('kpiLoad').textContent = `${data.load}%`; $('kpiHealth').textContent = `${data.health}%`; });
  render();
})();
</script>
</body>
</html>
