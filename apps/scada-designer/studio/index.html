<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>工业可视化配置工作台</title>
    <link rel="stylesheet" href="/studio.css" />
  </head>
  <body>
    <div id="app" v-cloak>
      <header v-if="!viewer">
        <b>工业可视化工作台</b><span class="grow">{{doc.title}}</span
        ><button v-if="editing" @click="openConfig">数据连接</button
        ><button @click="preview=!preview">{{preview?'返回编辑':'预览'}}</button
        ><template v-if="editing"
          ><button @click="save(false)">保存草稿</button
          ><button class="primary" @click="save(true)">发布</button
          ><button @click="versions">版本</button
          ><a href="/view" target="_blank" rel="noopener"
            >展示端 ↗</a
          ></template
        >
      </header>
      <div class="workspace" :class="{presentation:!editing}">
        <aside v-if="editing">
          <h2>场景模板</h2>
          <select
            aria-label="切换模板"
            :value="doc.template"
            @change="replace($event.target.value)"
          >
            <option value="01">01 · A²/O 生物处理</option>
            <option value="05">05 · 污泥回流泵站</option>
            <option value="30">30 · 园区能源中心</option>
            <option value="blank">空白画布</option>
          </select>
          <h2>组件库</h2>
          <div class="tools">
            <button v-for="(label,type) in types" @click="add(type)">
              {{label}}
            </button>
          </div>
          <h2>图层</h2>
          <button
            class="layer"
            v-for="n in [...doc.nodes].reverse()"
            :class="{active:ids.includes(n.id)}"
            @click="pick(n,$event)"
          >
            {{n.locked?'▣ ':''}}{{n.title}}
          </button>
          <h2>项目文件</h2>
          <button @click="exportDoc">导出配置</button>
          <label class="button"
            >导入配置<input
              type="file"
              accept=".json"
              @change="importDoc($event.target.files[0]);$event.target.value=''" /></label
          ><button @click="runExport">导出离线演示</button>
        </aside>
        <main ref="stage">
          <div
            class="board"
            :style="{transform:'translate(-50%,-50%) scale('+zoom+')'}"
          >
            <div class="board-title">
              <span>运行监视</span>
              <h1>{{doc.title}}</h1>
              <small>{{connection}}</small>
            </div>
            <section
              v-for="n in doc.nodes"
              :key="sourceVersion+'-'+n.id+'-'+n.type"
              class="panel"
              :class="{chosen:editing&&ids.includes(n.id)}"
              :data-id="n.id"
              :style="{left:n.x+'px',top:n.y+'px',width:n.w+'px',height:n.h+'px'}"
              @pointerdown="pick(n,$event)"
            >
              <h3 class="node-title">{{n.title}}</h3>
              <widget
                :n="n"
                :point="points[n.binding]"
                :points="points"
                :mappings="doc.mappings"
                :sequence="sequence"
              ></widget
              ><i v-if="editing&&!n.locked" class="handle"></i>
            </section>
          </div>
        </main>
        <aside v-if="editing">
          <h2>页面属性</h2>
          <label>名称<input v-model="doc.title" @focus="snapshot" /></label
          ><button @click="undo" :disabled="!undoCount">撤销</button>
          <template v-if="sel"
            ><h2>组件属性</h2>
            <label>标题<input v-model="sel.title" @focus="snapshot" /></label
            ><label v-if="mapped(sel.type)"
              >业务测点<select v-model="sel.binding" @focus="snapshot">
                <option v-if="sel.type==='table'" value="*">全部测点</option>
                <option v-for="m in doc.mappings" :value="m.id">
                  {{m.label}} · {{m.id}}
                </option>
              </select></label
            >
            <label v-if="sel.type==='chart'"
              >样式<select v-model="sel.series" @focus="snapshot">
                <option value="line">趋势线</option>
                <option value="bar">柱状图</option>
              </select></label
            >
            <label v-if="sel.type==='text'"
              >内容<textarea v-model="sel.text" @focus="snapshot"></textarea>
            </label>
            <label v-if="sel.type==='flow'"
              >工段（英文逗号分隔）<input v-model="sel.steps" @focus="snapshot"
            /></label>
            <label v-if="sel.type==='image'" class="button"
              >载入本地图片<input
                type="file"
                accept="image/png,image/jpeg,image/webp"
                @change="loadImage($event.target.files[0])"
            /></label>
            <template v-if="sel.type==='campus'"
              ><label
                >设备<select v-model="sel.entity" @focus="snapshot">
                  <option v-for="f in fans" :value="f.id">{{f.label}}</option>
                </select></label
              ><label
                >镜头<select v-model="sel.camera" @focus="snapshot">
                  <option value="equipment">设备特写</option>
                  <option value="overview">园区全景</option>
                </select></label
              ></template
            >
            <h2>排布</h2>
            <small>Shift 多选 · 拖动标题移动</small>
            <div class="tools">
              <button
                v-for="(label,key) in {copy:'复制',delete:'删除',front:'置顶',back:'置底',left:'左对齐',top:'顶对齐',lock:'锁定 / 解锁',group:'成组',ungroup:'解组'}"
                @click="action(key)"
              >
                {{label}}
              </button>
            </div></template
          >
        </aside>
      </div>
      <div
        v-if="editing&&message"
        role="status"
        class="toast"
        @click="message=''"
      >
        {{message}} ×
      </div>
      <div v-if="dialog" class="shade">
        <section class="dialog">
          <header>
            <b>{{dialog==='data'?'数据连接与点位映射':'发布版本'}}</b
            ><button @click="dialog=''">关闭</button>
          </header>
          <template v-if="dialog==='data'"
            ><div class="columns">
              <div>
                <label
                  >来源<select aria-label="来源" v-model="config.source.kind">
                    <option value="json">本地 JSON</option>
                    <option value="csv">本地 CSV</option>
                    <option value="rest">REST / 工业协议桥接</option>
                    <option value="ws">WebSocket JSON</option>
                  </select></label
                >
                <template v-if="['csv','json'].includes(config.source.kind)"
                  ><label
                    >样本内容<textarea
                      rows="5"
                      v-model="config.source.data"
                    ></textarea></label
                  ><label class="button"
                    >从文件载入<input
                      type="file"
                      @change="fileData($event.target.files[0])" /></label
                ></template>
                <label v-else
                  >接口 URL<input
                    v-model="config.source.url"
                    placeholder="http://127.0.0.1:8101/snapshot"
                /></label>
                <label
                  >刷新周期（ms）<input
                    type="number"
                    min="200"
                    v-model.number="config.source.pollMs" /></label
                ><label
                  >最大数据年龄（ms）<input
                    type="number"
                    min="1"
                    v-model.number="config.source.maxAgeMs" /></label
                ><button @click="readSample">读取样本</button
                ><button
                  v-if="Array.isArray(sample?.points)&&sample.points.every(p=>p.id&&p.kind)"
                  @click="bridgeMappings"
                >
                  从桥接点表生成映射
                </button>
                <pre>
{{sample===null?'等待读取':JSON.stringify(sample,null,2).slice(0,12000)}}</pre
                >
              </div>
              <div>
                <label
                  >测点<select aria-label="测点" v-model.number="mappingIndex">
                    <option v-for="(m,i) in config.mappings" :value="i">
                      {{m.label}} · {{m.id}}
                    </option>
                  </select></label
                ><button @click="addMap">新增测点</button>
                <button
                  v-if="currentMap"
                  @click="config.mappings.splice(mappingIndex,1);mappingIndex=0"
                >
                  移除测点
                </button>
                <template v-if="currentMap"
                  ><div class="pair">
                    <label>业务编号<input v-model="currentMap.id" /></label
                    ><label>显示名称<input v-model="currentMap.label" /></label>
                  </div>
                  <label
                    >数值路径（$ 表示整条记录）<input
                      v-model="currentMap.path"
                      list="field-paths" /></label
                  ><datalist id="field-paths">
                    <option v-for="p in paths" :value="p"></option>
                  </datalist>
                  <div class="pair">
                    <label
                      >类型<select v-model="currentMap.kind">
                        <option value="number">数值</option>
                        <option value="boolean">布尔</option>
                        <option value="text">文本</option>
                        <option value="dataset">行数据集</option>
                      </select></label
                    ><label>单位<input v-model="currentMap.unit" /></label>
                  </div>
                  <details>
                    <summary>换算、行筛选与质量</summary>
                    <div class="pair">
                      <label
                        v-for="(name,k) in {scale:'倍率',offset:'偏移',precision:'小数位'}"
                        >{{name}}<input
                          type="number"
                          v-model.number="currentMap[k]"
                      /></label>
                    </div>
                    <label
                      v-for="(name,k) in {root:'根路径',keyField:'行标识字段',keyValue:'匹配值',timePath:'源时间字段',qualityPath:'质量字段'}"
                      >{{name}}<input
                        v-model="currentMap[k]"
                        list="field-paths" /></label
                    ><label
                      >枚举换算 JSON<input
                        :value="JSON.stringify(currentMap.enumMap||{})"
                        @change="setEnum($event.target.value)"
                    /></label></details
                ></template>
              </div>
            </div>
            <button class="primary" @click="applyConfig">
              应用数据配置
            </button></template
          >
          <template v-else
            ><p v-if="!versionInfo.versions.length">尚无发布版本</p>
            <p v-for="v in versionInfo.versions">
              {{new Date(v.time).toLocaleString()}} · {{v.title}}
              <button
                :disabled="versionInfo.active===v.id"
                @click="rollback(v.id)"
              >
                {{versionInfo.active===v.id?'当前展示':'回退至此版'}}
              </button>
            </p></template
          >
        </section>
      </div>
    </div>
    <script src="/lib/vue.js"></script>
    <script src="/lib/echarts.js"></script>
    <script src="/lib/three.js"></script>
    <script src="/lib/campus.js"></script>
    <script src="/lib/interact.js"></script>
    <script type="module" src="/app.mjs"></script>
  </body>
</html>
